    <meta property="og:title" content="Έρχομαι — Αφίξεις λεωφορείων ΟΑΣΑ" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Έρχομαι — Αφίξεις λεωφορείων ΟΑΣΑ" />
    <meta name="twitter:description" content="Αφίξεις λεωφορείων ΟΑΣΑ σε πραγματικό χρόνο για την πλησιέστερη στάση." />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Έρχομαι",
      "description": "Αφίξεις λεωφορείων ΟΑΣΑ σε πραγματικό χρόνο για την πλησιέστερη στάση",
      "url": "https://erhomai.gr",
      "applicationCategory": "TravelApplication",
      "operatingSystem": "All",
      "inLanguage": "el"
    }
    </script>

    <title>Έρχομαι — Αφίξεις λεωφορείων ΟΑΣΑ</title>
  </head>
  <body>
    <div id="loading-msg" style="padding:16px;font-family:Arial,sans-serif;font-size:14px;color:#666;">Loading... | Φόρτωση...</div>
    <div id="root"></div>
    <noscript>Please enable JavaScript to use this app. | <span lang="el">Παρακαλώ ενεργοποιήστε τη JavaScript.</span></noscript>
    <script>
      document.getElementById('loading-msg').remove();
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          document.getElementById('root').innerHTML = '<div style="padding:16px;color:red;font:13px monospace;"><strong>Failed to load:</strong><pre>'+e.target.src||e.target.href+'</pre></div>';
        }
      }, true);
      window.onerror = function(m, s, l, c, e) {
        document.getElementById('root').innerHTML = '<div style="padding:16px;color:red;font:13px monospace;"><strong>Error:</strong><pre>'+String(m)+'\n'+String(s)+':'+l+':'+c+'</pre></div>';
      };
      window.addEventListener('unhandledrejection', function(e) {
        document.getElementById('root').innerHTML = '<div style="padding:16px;color:red;font:13px monospace;"><strong>Unhandled:</strong><pre>'+String(e.reason)+'</pre></div>';
      });
    </script>
    <div id="status" style="position:fixed;top:0;left:0;z-index:99999;background:#111;color:#0f0;font:11px monospace;padding:4px 8px;">.</div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
