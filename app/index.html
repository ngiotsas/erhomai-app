  <body>
    <div id="debug" style="position:fixed;top:0;left:0;right:0;z-index:9999;background:#ff0;color:#000;font:12px monospace;padding:4px 8px;display:none;"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      var dbg = document.getElementById('debug');
      var root = document.getElementById('root');
      new MutationObserver(function() {
        dbg.textContent = (new Date().toISOString()) + ' root children: ' + root.children.length + ' html: ' + root.innerHTML.substring(0,100);
        dbg.style.display = 'block';
      }).observe(root, { childList: true, subtree: true });
      window.onerror = function(m,s,l,c,e) {
        dbg.textContent = 'onerror: ' + m + ' | ' + s + ':' + l;
        dbg.style.display = 'block';
      };
    </script>
  </body>
